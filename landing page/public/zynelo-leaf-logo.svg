<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12372A" />
      <stop offset="50%" stop-color="#1E8A63" />
      <stop offset="100%" stop-color="#B7E4C7" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6B56D" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Stylized Palm Leaf / Dynamic Seed Curve -->
  <path d="M8 40C8 40 12 24 24 16C36 8 42 6 42 6C42 6 38 18 28 28C18 38 8 40 8 40Z" fill="url(#leafGrad)" />
  
  <!-- Secondary Leaf Blade with transparency -->
  <path d="M12 40C12 40 22 36 28 26C34 16 38 10 38 10C38 10 30 20 20 30C14 36 12 40 12 40Z" fill="#B7E4C7" fill-opacity="0.35" />

  <!-- Central Stem & Neural Network Nodes -->
  <path d="M8 40Q24 24 38 10" stroke="url(#neuralGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Neural Branches & Leaf Ribs -->
  <path d="M16 32L12 26" stroke="#B7E4C7" stroke-width="1.8" stroke-linecap="round" />
  <path d="M22 26L20 18" stroke="#B7E4C7" stroke-width="1.8" stroke-linecap="round" />
  <path d="M28 20L34 16" stroke="#D6B56D" stroke-width="1.8" stroke-linecap="round" />
  <path d="M22 26L28 28" stroke="#B7E4C7" stroke-width="1.8" stroke-linecap="round" />

  <!-- Node Points -->
  <circle cx="8" cy="40" r="3" fill="#D6B56D" />
  <circle cx="16" cy="32" r="2.2" fill="#B7E4C7" />
  <circle cx="22" cy="26" r="2.8" fill="#FFFFFF" />
  <circle cx="28" cy="20" r="2.2" fill="#B7E4C7" />
  <circle cx="38" cy="10" r="3.2" fill="#D6B56D" filter="url(#glow)" />
  <circle cx="12" cy="26" r="1.8" fill="#B7E4C7" />
  <circle cx="20" cy="18" r="1.8" fill="#B7E4C7" />
  <circle cx="34" cy="16" r="1.8" fill="#D6B56D" />
</svg>
